[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/preguntas"
  to = "/preguntas.html"
  status = 200
[[redirects]]
  from = "/foto"
  to = "/foto.html"
  status = 200
[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200
[[redirects]]
  from = "/preguntas/"
  to = "/preguntas"
  status = 301
[[redirects]]
  from = "/foto/"
  to = "/foto"
  status = 301
[[redirects]]
  from = "/legal/"
  to = "/legal"
  status = 301
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; worker-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Do not force a download: allow Safari/installed calendar apps to handle ICS.
[[headers]]
  for = "/nyx-sonoro-22-octubre-2026.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = 'inline; filename="nyx-sonoro-22-octubre-2026.ics"'
